name: Public package and protocol checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inspection dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[hub,test]' pillow numpy
      - name: Compile the public entry points
        run: python -m compileall -q packages/fp4-repair/src tools/public
      - name: Verify package, frozen metadata and budget arithmetic
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python -m pytest -q tests/public packages/fp4-repair/tests/test_compute_budget.py
          tw-infer --doctor
          python tools/public/audit.py
