[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderworld-fp4"
version = "0.3.0"
description = "Configurable native FP4 streaming attention with block residual repair"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
hub = ["huggingface-hub>=1.0"]
cuda = ["torch>=2.11,<2.12", "triton>=3.6,<3.7; platform_system == 'Linux'"]
test = ["pytest>=8"]
cosmos = ["diffusers>=0.41.0.dev0", "transformers>=5", "accelerate", "safetensors", "numpy", "pillow", "sentencepiece", "protobuf", "av"]
evaluation = ["lpips", "scikit-image", "scipy"]

[project.scripts]
tw-infer = "thunderworld_fp4.hub:main"
tw-cosmos = "thunderworld_fp4.cosmos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thunderworld_fp4 = ["presets/*.json", "cutlass/*.cu", "cutlass/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an explicitly selected SM120 GPU"]
